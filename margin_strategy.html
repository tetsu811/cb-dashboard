<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>台股融資風險策略</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--blue:#2457d6;--green:#087a55;--red:#c93434;--amber:#b56b00;--line:#dde4ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.hero{padding:28px max(20px,4vw);background:linear-gradient(135deg,#111c35,#244d91);color:#fff}.hero h1{margin:0;font-size:28px}.hero p{margin:5px 0 0;opacity:.82}.wrap{max-width:1320px;margin:auto;padding:22px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 14px #1b2a4210}.card{padding:16px}.label{font-size:12px;color:var(--muted)}.value{font-size:27px;font-weight:800;margin-top:3px}.note{font-size:12px;color:var(--muted);margin-top:3px}.panel{padding:18px;margin-top:16px}.regime{display:grid;grid-template-columns:1.1fr 2fr;gap:18px}.signal{border-left:5px solid var(--blue);padding:12px 14px;background:#f7f9fd;border-radius:8px}.signal strong{font-size:20px}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rule{padding:12px;background:#f8fafc;border-radius:9px;border:1px solid var(--line)}.rule b{display:block;margin-bottom:4px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.toolbar input,.toolbar select{border:1px solid #cbd5e1;border-radius:8px;padding:9px 10px;background:#fff}.toolbar input{min-width:230px}.tablebox{overflow:auto;max-height:720px;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:1120px;background:#fff}th{position:sticky;top:0;background:#182b51;color:#fff;padding:10px 8px;white-space:nowrap;cursor:pointer}td{padding:8px;border-bottom:1px solid #edf0f5;text-align:right;white-space:nowrap}td:nth-child(-n+4){text-align:left}tr:hover{background:#f4f7ff}.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-weight:700;font-size:12px}.critical{background:#fee2e2;color:#a51d1d}.high{background:#ffedd5;color:#a44d05}.watch{background:#fef3c7;color:#885500}.normal{background:#dcfce7;color:#087a55}.method{font-size:13px;color:#475467}.src{font-size:12px;color:var(--muted)}@media(max-width:850px){.cards{grid-template-columns:1fr 1fr}.regime{grid-template-columns:1fr}.rules{grid-template-columns:1fr}.wrap{padding:12px}.hero{padding:22px 18px}}@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.value{font-size:21px}}
</style></head><body><header class="hero"><h1>台股融資風險策略</h1><p id="asof">讀取最新盤後資料…</p></header><main class="wrap"><section class="cards" id="cards"></section><section class="panel regime"><div id="regime"></div><div><h3>操作框架</h3><div class="rules"><div class="rule"><b>降低槓桿</b>大盤維持率下滑，同時融資餘額增加；優先避開融資增、股價跌的個股。</div><div class="rule"><b>等待清洗</b>個股回檔超過10%，融資20日減少逾10%；等價格止跌而不是直接摸底。</div><div class="rule"><b>確認轉強</b>推估維持率回到166%以上、融資不再逆勢增加，並突破短期反彈高點。</div></div></div></section><section class="panel"><h3>全市場個股</h3><div class="toolbar"><input id="q" placeholder="搜尋代號或公司"><select id="band"><option value="">全部維持率</option><option>低於130%</option><option>130–140%</option><option>140–150%</option><option>150–166%</option><option>166%以上</option></select><select id="quality"><option value="">全部品質</option><option>高</option><option>中</option><option>低</option></select><select id="signal"><option value="">全部策略</option><option>擁擠下跌</option><option>融資清洗</option><option>正常觀察</option></select></div><div class="tablebox"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div></section><section class="panel method"><b>計算口徑：</b>個股融資餘額、融券餘額採交易所官方資料；個股融資維持率＝收盤價÷（移動加權推估融資成本×60%）。真正追繳以券商整戶維持率為準。<p class="src">資料來源：臺灣證券交易所、證券櫃檯買賣中心。大盤擔保維持率為官方彙整值；個股維持率為估算值。</p></section></main><script>
let DATA,rows=[],sortKey='maintenance',sortDir=1;const cols=[['id','代號'],['name','名稱'],['market','市場'],['close','收盤'],['drawdown','距20日高點'],['margin_balance','融資餘額'],['short_balance','融券餘額'],['margin_change_20d','融資20日'],['cost','推估成本'],['maintenance','推估維持率'],['band','區間'],['strategy','策略'],['quality','品質']];
const fmt=(v,d=0)=>v==null?'—':Number(v).toLocaleString('zh-TW',{maximumFractionDigits:d,minimumFractionDigits:d});const pct=v=>v==null?'—':`${v>=0?'+':''}${fmt(v*100,1)}%`;function pill(x){let c=x==='低於130%'?'critical':x==='130–140%'||x==='140–150%'?'high':x==='150–166%'?'watch':'normal';return `<span class="pill ${c}">${x}</span>`}
function regime(k){if(k>=180)return['槓桿環境穩定','normal','大盤維持率仍在180%以上，可維持一般風險預算，但不追逐融資快速增加的弱勢股。'];if(k>=166)return['進入觀察區','watch','降低新增槓桿，優先保留趨勢完整且融資未擴張的個股。'];if(k>=150)return['防守區','high','縮小部位，停止攤平融資增加且股價下跌的標的。'];return['高風險區','critical','以去槓桿與流動性為先，個股反彈不等於風險解除。']}
function renderTop(){const m=DATA.market,r=regime(m.keep_rate);document.querySelector('#asof').textContent=`更新：${DATA.as_of}｜盤後資料`;document.querySelector('#cards').innerHTML=`<div class=card><div class=label>官方大盤擔保維持率</div><div class=value>${fmt(m.keep_rate,1)}%</div><div class=note>前一日 ${fmt(m.prev_keep_rate,1)}%</div></div><div class=card><div class=label>上市融資餘額</div><div class=value>${fmt(m.twse_margin_amount_100m,0)} 億</div><div class=note>${fmt(m.twse_margin_shares)} 張</div></div><div class=card><div class=label>上櫃融資餘額</div><div class=value>${fmt(m.tpex_margin_amount_100m,0)} 億</div><div class=note>官方盤後彙總</div></div><div class=card><div class=label>融券餘額</div><div class=value>${fmt(m.twse_short_shares+m.tpex_short_shares)} 張</div><div class=note>上市＋上櫃</div></div>`;document.querySelector('#regime').innerHTML=`<h3>市場狀態</h3><div class="signal ${r[1]}"><strong>${r[0]}</strong><div>${r[2]}</div></div>`}
function filtered(){let q=document.querySelector('#q').value.trim(),b=document.querySelector('#band').value,ql=document.querySelector('#quality').value,s=document.querySelector('#signal').value;return rows.filter(x=>(!q||(x.id+x.name).includes(q))&&(!b||x.band===b)&&(!ql||x.quality===ql)&&(!s||x.strategy===s)).sort((a,b)=>{let x=a[sortKey],y=b[sortKey];return(typeof x==='string'?x.localeCompare(y):(x??9e99)-(y??9e99))*sortDir})}
function render(){document.querySelector('#head').innerHTML=cols.map(c=>`<th data-k="${c[0]}">${c[1]}</th>`).join('');document.querySelector('#body').innerHTML=filtered().map(x=>`<tr><td>${x.id}</td><td>${x.name}</td><td>${x.market}</td><td>${fmt(x.close,2)}</td><td>${pct(x.drawdown)}</td><td>${fmt(x.margin_balance)}</td><td>${fmt(x.short_balance)}</td><td>${pct(x.margin_change_20d)}</td><td>${fmt(x.cost,2)}</td><td>${fmt(x.maintenance,1)}%</td><td>${pill(x.band)}</td><td>${x.strategy}</td><td>${x.quality}</td></tr>`).join('');document.querySelectorAll('th').forEach(h=>h.onclick=()=>{sortDir=sortKey===h.dataset.k?-sortDir:1;sortKey=h.dataset.k;render()})}
document.querySelector('#signal').insertAdjacentHTML('afterbegin','<option>高風險</option><option>防守觀察</option>');
fetch('margin_strategy_latest.json?v='+Date.now()).then(r=>r.json()).then(d=>{DATA=d;rows=d.stocks;renderTop();render();['q','band','quality','signal'].forEach(id=>document.querySelector('#'+id).addEventListener('input',render))}).catch(()=>document.querySelector('#asof').textContent='資料載入失敗，請稍後重試');
</script></body></html>
