<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股融資風險策略</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#15213a;--muted:#667085;--blue:#2457d6;--green:#087a55;--red:#c93434;--amber:#b56b00;--line:#dce3ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.hero{padding:27px max(18px,4vw);background:linear-gradient(135deg,#101b34,#244d91);color:#fff}.hero h1{margin:0;font-size:28px}.hero p{margin:5px 0 0;opacity:.82}.wrap{max-width:1380px;margin:auto;padding:20px}.cards,.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 14px #1b2a4210}.card{padding:15px}.label{font-size:12px;color:var(--muted)}.value{font-size:26px;font-weight:800}.note{font-size:12px;color:var(--muted)}.panel{padding:18px;margin-top:16px}.regime{display:grid;grid-template-columns:1fr 2fr;gap:18px}.signal{border-left:5px solid var(--blue);padding:12px;background:#f7f9fd;border-radius:8px}.signal strong{font-size:20px}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rule{padding:11px;background:#f8fafc;border:1px solid var(--line);border-radius:9px}.rule b{display:block}.detailhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.detailhead h2{margin:0}.hint{color:var(--muted)}.mini{margin:13px 0}.mini .card{box-shadow:none}.mini .value{font-size:20px}.chartbox{height:350px}.chartbox.small{height:250px;margin-top:14px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.toolbar input,.toolbar select{border:1px solid #cbd5e1;border-radius:8px;padding:9px 10px;background:#fff}.toolbar input{min-width:230px}.tablebox{overflow:auto;max-height:690px;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:1120px}th{position:sticky;top:0;background:#182b51;color:#fff;padding:10px 8px;white-space:nowrap;cursor:pointer}td{padding:8px;border-bottom:1px solid #edf0f5;text-align:right;white-space:nowrap}td:nth-child(-n+4){text-align:left}tbody tr{cursor:pointer}tbody tr:hover{background:#edf3ff}.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-weight:700;font-size:12px}.critical{background:#fee2e2;color:#a51d1d}.high{background:#ffedd5;color:#a44d05}.watch{background:#fef3c7;color:#885500}.normal{background:#dcfce7;color:#087a55}.method{font-size:13px;color:#475467}.src{font-size:12px;color:var(--muted)}@media(max-width:850px){.cards,.mini{grid-template-columns:1fr 1fr}.regime{grid-template-columns:1fr}.wrap{padding:11px}.chartbox{height:300px}}@media(max-width:480px){.value{font-size:21px}.detailhead{display:block}}
</style></head><body><header class="hero"><h1>台股融資風險策略</h1><p id="asof">讀取最新盤後資料…</p></header><main class="wrap"><section class="cards" id="cards"></section><section class="panel regime"><div id="regime"></div><div><h3>操作框架</h3><div class="rules"><div class="rule"><b>降低槓桿</b>大盤維持率下滑且融資餘額增加，避開融資增、股價跌。</div><div class="rule"><b>等待清洗</b>回檔逾10%且融資20日減少逾10%，等待價格止跌。</div><div class="rule"><b>確認轉強</b>推估維持率回到166%以上、融資不再逆勢增加。</div></div></div></section>
<section class="panel" id="detail"><div class="detailhead"><div><h2 id="detailTitle">點選下方個股查看半年壓力圖</h2><div class="hint">紅色區段＝加權指數 5 日跌幅 ≤ −4%，或距 20 日高點 ≤ −8%</div></div><div id="loading"></div></div><div class="mini" id="mini"></div><div class="chartbox"><canvas id="priceChart"></canvas></div><div class="chartbox small"><canvas id="maintChart"></canvas></div></section>
<section class="panel"><h3>全市場個股</h3><div class="toolbar"><input id="q" placeholder="搜尋代號或公司"><select id="band"><option value="">全部維持率</option><option>低於130%</option><option>130–140%</option><option>140–150%</option><option>150–166%</option><option>166%以上</option></select><select id="quality"><option value="">全部品質</option><option>高</option><option>中</option><option>低</option></select><select id="signal"><option value="">全部策略</option><option>高風險</option><option>防守觀察</option><option>擁擠下跌</option><option>融資清洗</option><option>正常觀察</option></select></div><div class="tablebox"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div></section>
</main><script>
let DATA,rows=[],sortKey='margin_balance',sortDir=-1,pc,mc;const shardCache={};const cols=[['id','代號'],['name','名稱'],['market','市場'],['close','收盤'],['drawdown','距20日高點'],['margin_balance','融資餘額'],['short_balance','融券餘額'],['margin_change_20d','融資20日'],['cost','推估成本'],['maintenance','推估維持率'],['band','區間'],['strategy','策略'],['quality','品質']];
const fmt=(v,d=0)=>v==null?'—':Number(v).toLocaleString('zh-TW',{maximumFractionDigits:d,minimumFractionDigits:d}),pct=v=>v==null?'—':`${v>=0?'+':''}${fmt(v*100,1)}%`;function pill(x){let c=x==='低於130%'?'critical':x==='130–140%'||x==='140–150%'?'high':x==='150–166%'?'watch':'normal';return `<span class="pill ${c}">${x}</span>`}function regime(k){if(k>=180)return['槓桿環境穩定','大盤維持率在180%以上；仍避開融資快速增加的弱勢股。'];if(k>=166)return['進入觀察區','降低新增槓桿，保留趨勢完整且融資未擴張個股。'];if(k>=150)return['防守區','縮小部位，停止攤平融資增加且股價下跌標的。'];return['高風險區','去槓桿與流動性優先，反彈不等於風險解除。']}
function renderTop(){const m=DATA.market,r=regime(m.keep_rate);asof.textContent=`更新：${DATA.as_of}｜盤後資料`;cards.innerHTML=`<div class=card><div class=label>官方大盤擔保維持率</div><div class=value>${fmt(m.keep_rate,1)}%</div><div class=note>前一日 ${fmt(m.prev_keep_rate,1)}%</div></div><div class=card><div class=label>上市融資餘額</div><div class=value>${fmt(m.twse_margin_amount_100m)} 億</div><div class=note>${fmt(m.twse_margin_shares)} 張</div></div><div class=card><div class=label>上櫃融資餘額</div><div class=value>${fmt(m.tpex_margin_amount_100m)} 億</div><div class=note>官方盤後彙總</div></div><div class=card><div class=label>融券餘額</div><div class=value>${fmt(m.twse_short_shares+m.tpex_short_shares)} 張</div><div class=note>上市＋上櫃</div></div>`;document.querySelector('#regime').innerHTML=`<h3>市場狀態</h3><div class=signal><strong>${r[0]}</strong><div>${r[1]}</div></div>`}
function filtered(){let t=q.value.trim(),b=band.value,ql=quality.value,s=signal.value;return rows.filter(x=>(!t||(x.id+x.name).includes(t))&&(!b||x.band===b)&&(!ql||x.quality===ql)&&(!s||x.strategy===s)).sort((a,b)=>{let x=a[sortKey],y=b[sortKey];return(typeof x==='string'?x.localeCompare(y):(x??9e99)-(y??9e99))*sortDir})}function render(){head.innerHTML=cols.map(c=>`<th data-k="${c[0]}">${c[1]}</th>`).join('');body.innerHTML=filtered().map(x=>`<tr data-id="${x.id}"><td>${x.id}</td><td>${x.name}</td><td>${x.market}</td><td>${fmt(x.close,2)}</td><td>${pct(x.drawdown)}</td><td>${fmt(x.margin_balance)}</td><td>${fmt(x.short_balance)}</td><td>${pct(x.margin_change_20d)}</td><td>${fmt(x.cost,2)}</td><td>${fmt(x.maintenance,1)}%</td><td>${pill(x.band)}</td><td>${x.strategy}</td><td>${x.quality}</td></tr>`).join('');document.querySelectorAll('th').forEach(h=>h.onclick=()=>{sortDir=sortKey===h.dataset.k?-sortDir:1;sortKey=h.dataset.k;render()});document.querySelectorAll('tbody tr').forEach(r=>r.onclick=()=>openStock(r.dataset.id))}
const stressPlugin={id:'stress',beforeDraw(c){const h=c.options.plugins.stress?.flags;if(!h)return;const {ctx,chartArea:{top,bottom},scales:{x}}=c;ctx.save();ctx.fillStyle='#dc262614';h.forEach((v,i)=>{if(v){const a=x.getPixelForValue(i-.5),b=x.getPixelForValue(i+.5);ctx.fillRect(a,top,b-a,bottom-top)}});ctx.restore()}};Chart.register(stressPlugin);
async function openStock(id){loading.textContent='載入半年資料…';let k=id[0];if(!shardCache[k])shardCache[k]=fetch(`margin_history_${k}.json?v=${DATA.as_of}`).then(r=>r.json());const s=(await shardCache[k]).stocks[id];loading.textContent='';if(!s){detailTitle.textContent=`${id} 尚無足夠歷史資料`;return}const h=s.h,L=h.map(x=>x[0]),baseS=h[0][1],baseI=h.find(x=>x[4])?.[4],sn=h.map(x=>x[1]/baseS*100),ix=h.map(x=>x[4]?x[4]/baseI*100:null),flags=ix.map((v,i)=>{let hi=Math.max(...ix.slice(Math.max(0,i-19),i+1).filter(Boolean)),r5=i>=5?v/ix[i-5]-1:0,dd=v/hi-1;return r5<=-.04||dd<=-.08});let wi=ix.reduce((a,v,i)=>v!=null&&v<ix[a]?i:a,0),sr=sn[wi]/100-1,ir=ix[wi]/100-1;detailTitle.textContent=`${id} ${s.name}｜近半年壓力對照`;mini.innerHTML=`<div class=card><div class=label>最新推估維持率</div><div class=value>${fmt(h.at(-1)[3],1)}%</div></div><div class=card><div class=label>半年股價</div><div class=value>${pct(h.at(-1)[1]/baseS-1)}</div></div><div class=card><div class=label>大盤最弱日</div><div class=value>${L[wi]}</div><div class=note>指數 ${pct(ir)}</div></div><div class=card><div class=label>該日個股／維持率</div><div class=value>${pct(sr)}</div><div class=note>${fmt(h[wi][3],1)}%</div></div>`;pc?.destroy();mc?.destroy();pc=new Chart(priceChart,{data:{labels:L,datasets:[{type:'bar',label:'成交量(百萬股)',data:h.map(x=>x[2]/1e6),yAxisID:'v',backgroundColor:'#94a3b855',order:4},{type:'line',label:'個股股價(起點=100)',data:sn,borderColor:'#2457d6',pointRadius:0,borderWidth:2,yAxisID:'y',order:1},{type:'line',label:'加權指數(起點=100)',data:ix,borderColor:'#111827',pointRadius:0,borderWidth:2,yAxisID:'y',order:2},{type:'line',label:'推估融資維持率',data:h.map(x=>x[3]),borderColor:'#c93434',backgroundColor:'#c93434',pointRadius:0,borderWidth:2.5,borderDash:[7,4],yAxisID:'m',order:3}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{stress:{flags},title:{display:true,text:'股價、融資維持率、成交量與大盤位置'},tooltip:{callbacks:{afterBody:c=>{const r=h[c[0].dataIndex];return [`個股股價：${fmt(r[1],2)} 元`,`加權指數：${fmt(r[4],2)} 點`,`融資維持率：${fmt(r[3],1)}%`]}}}},scales:{y:{title:{display:true,text:'股價／大盤相對位置'}},m:{position:'right',suggestedMin:100,suggestedMax:200,grid:{drawOnChartArea:false},title:{display:true,text:'維持率 %'}},v:{position:'right',display:false,grid:{display:false}},x:{ticks:{maxTicksLimit:12}}}}});mc=new Chart(maintChart,{type:'line',data:{labels:L,datasets:[{label:'推估融資維持率',data:h.map(x=>x[3]),borderColor:'#c93434',backgroundColor:'#c9343420',fill:true,pointRadius:0,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{stress:{flags},title:{display:true,text:'推估融資維持率（紅色背景為大盤急跌區）'}},scales:{y:{suggestedMin:100,suggestedMax:200,title:{display:true,text:'維持率 %'}},x:{ticks:{maxTicksLimit:12}}}}});detail.scrollIntoView({behavior:'smooth',block:'start'})}
fetch('margin_strategy_latest.json?v='+Date.now()).then(r=>r.json()).then(d=>{DATA=d;rows=d.stocks;renderTop();render();['q','band','quality','signal'].forEach(id=>document.querySelector('#'+id).addEventListener('input',render));openStock(rows[0].id)}).catch(()=>asof.textContent='資料載入失敗，請稍後重試');
</script><script src="margin_strategy_overrides.js?v=20261018"></script></body></html>
