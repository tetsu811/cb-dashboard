name: Update Margin Strategy
on:
  workflow_dispatch:
  schedule:
    # 22:15 and 23:15 Asia/Taipei after the official margin release.
    - cron: '15 14,15 * * 1-5'
    # 00:15 Asia/Taipei fallback for the preceding trading day.
    - cron: '15 16 * * 2-6'
permissions:
  contents: write
concurrency:
  group: update-margin-strategy
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Generate latest margin data
        run: python generate_margin_strategy.py
      - name: Generate latest market breadth data
        run: |
          test -f generate_market_breadth.py
          python generate_market_breadth.py
      - name: Check expected Taiwan trading date
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo('Asia/Taipei'))
          expected = now.date() if now.hour >= 18 else now.date() - timedelta(days=1)
          while expected.weekday() >= 5:
              expected -= timedelta(days=1)
          dates = {
              'margin_strategy_latest.json': json.load(open('margin_strategy_latest.json'))['as_of'],
              'market_breadth_latest.json': json.load(open('market_breadth_latest.json'))['as_of'],
          }
          print(f'Taipei time={now.isoformat(timespec="seconds")} expected={expected} actual={dates}')
          stale = [name for name, value in dates.items() if value != expected.isoformat()]
          if stale:
              raise SystemExit(f'Official data has not advanced to {expected}: {stale}')
          PY
      - name: Check whether official data advanced
        id: changes
        run: |
          if git diff --quiet -- margin_strategy_latest.json margin_history_*.json market_breadth_latest.json; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "Official data has not advanced; nothing to publish."
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit data
        if: steps.changes.outputs.updated == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add margin_strategy_latest.json margin_history_*.json market_breadth_latest.json
          git commit -m "Update margin strategy data"
          git pull --rebase --autostash origin main
          git push
      - name: Verify public data date
        run: |
          python verify_margin_publish.py --url https://tetsu811.github.io/cb-dashboard/margin_strategy_latest.json
          python verify_margin_publish.py --url https://tetsu811.github.io/cb-dashboard/market_breadth_latest.json
