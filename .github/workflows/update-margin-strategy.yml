name: Update Margin Strategy
on:
  workflow_dispatch:
  schedule:
    # 19:30 and 21:30 Asia/Taipei. The later run is a fallback when
    # exchange data was not yet available on the first attempt.
    - cron: '30 11,13 * * 1-5'
permissions:
  contents: write
concurrency:
  group: update-margin-strategy
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python generate_margin_strategy.py
      - name: Check whether official data advanced
        id: changes
        run: |
          if git diff --quiet -- margin_strategy_latest.json margin_history_*.json; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "Official data has not advanced; nothing to publish."
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit data
        if: steps.changes.outputs.updated == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add margin_strategy_latest.json margin_history_*.json
          git commit -m "Update margin strategy data"
          git pull --rebase --autostash origin main
          git push
      - name: Verify public data date
        if: steps.changes.outputs.updated == 'true'
        run: python verify_margin_publish.py --url https://tetsu811.github.io/cb-dashboard/margin_strategy_latest.json
