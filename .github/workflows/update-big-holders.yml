name: Update Big Holders Dashboard

on:
  workflow_dispatch:
  schedule:
    # TDCC 是週資料；每日 18:00 台北時間檢查一次，資料沒變就不提交。
    - cron: '0 10 * * *'

permissions:
  contents: write

concurrency:
  group: update-big-holders
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Generate from official TDCC OpenAPI
        run: python generate_big_holders.py

      - name: Commit data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add big_holders_index.html big_holders_latest.json big_holders_data/ stock_names.json
          if git diff --cached --quiet; then
            echo "No TDCC changes to publish."
          else
            git commit -m "Update big holders dashboard"
            git pull --rebase --autostash origin main
            git push
          fi
