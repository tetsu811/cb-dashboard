name: Update Cybersecurity Dashboard

on:
  schedule:
    # 美股收盤後，待日線資料完成再刷新。
    - cron: '50 22 * * 1-5'
    - cron: '50 23 * * 1-5'
    - cron: '50 0 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cybersecurity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas requests

      - name: Refresh completed daily quotes
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python generate_cybersecurity.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cybersecurity.html cybersecurity_latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update cybersecurity dashboard $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push
          fi
