name: Update TW Market Dashboard

on:
  schedule:
    # Staggered close-window retries make a delayed Yahoo/TWSE publication or
    # one missed GitHub schedule harmless.
    - cron: '30 0 * * 1-5'
    - cron: '17 1 * * 1-5'
    - cron: '17 2 * * 1-5'
    - cron: '17 4 * * 1-5'
    - cron: '17 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tw-market
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas requests

      - name: Generate TW market dashboard
        run: python generate_tw_market.py

      - name: Validate official TWSE date
        run: |
          python - <<'PY'
          import json
          from generate_tw_market import fetch_latest_twse_close

          expected, _ = fetch_latest_twse_close()
          actual = json.load(open('tw_market_latest.json'))['date']
          print(f'expected={expected} actual={actual}')
          if not expected or actual != expected:
              raise SystemExit('TW market dashboard did not reach the latest official TWSE date')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tw_market.html tw_market_latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update TW market dashboard $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push
          fi
