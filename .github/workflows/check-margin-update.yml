name: Check Margin Update Trigger

on:
  workflow_dispatch:
  schedule:
    # 00:45 Asia/Taipei, after all three update attempts.
    - cron: '45 16 * * 2-6'

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm a scheduled update was triggered
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '11 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          count=$(gh run list \
            --workflow update-margin-strategy.yml \
            --event schedule \
            --limit 10 \
            --json createdAt \
            --jq "[.[] | select(.createdAt >= \"$cutoff\")] | length")
          echo "Scheduled runs since $cutoff: $count"
          test "$count" -gt 0

      - name: Confirm public data advanced
        run: |
          curl --fail --silent --show-error --location \
            https://tetsu811.github.io/cb-dashboard/margin_strategy_latest.json \
            --output margin.json
          curl --fail --silent --show-error --location \
            https://tetsu811.github.io/cb-dashboard/market_breadth_latest.json \
            --output breadth.json
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo('Asia/Taipei'))
          expected = now.date() - timedelta(days=1)
          while expected.weekday() >= 5:
              expected -= timedelta(days=1)
          dates = {
              'margin': json.load(open('margin.json'))['as_of'],
              'breadth': json.load(open('breadth.json'))['as_of'],
          }
          print(f'expected={expected} public={dates}')
          if any(value != expected.isoformat() for value in dates.values()):
              raise SystemExit('Public margin data did not advance to the expected trading date')
          PY
