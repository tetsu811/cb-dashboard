name: Update TXO Structure Map

on:
  workflow_dispatch:
  schedule:
    # 台指選擇權日盤資料完整後，台北時間 17:10 與 18:10 重試。
    - cron: '10 1 * * 1-5'
    - cron: '10 2 * * 1-5'
    - cron: '27 5 * * 1-5'
    - cron: '27 7 * * 1-5'
    - cron: '27 15 * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-txo-map
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Install dependency
        run: pip install requests beautifulsoup4

      - name: Generate from official TAIFEX OpenAPI
        run: python generate_txo_map.py

      - name: Commit data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add txo_map.html txo_map_latest.json
          if git diff --cached --quiet; then
            echo "No completed TAIFEX session to publish."
          else
            git commit -m "Update TXO structure map"
            git pull --rebase --autostash origin main
            git push
          fi
