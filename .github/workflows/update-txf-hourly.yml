name: Update TXF Hourly Levels

on:
  workflow_dispatch:
  schedule:
    # 台北時間：日盤 08:47、09:02–13:02、13:47；夜盤 15:02–隔日 05:02。
    - cron: '47 0 * * 1-5'
    - cron: '2 1-5 * * 1-5'
    - cron: '47 5 * * 1-5'
    - cron: '2 7 * * 1-5'
    - cron: '2 8-21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-txf-hourly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Install dependency
        run: pip install requests

      - name: Calculate completed hourly levels
        run: python generate_txf_hourly.py

      - name: Commit data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add txf_hourly.html txf_hourly_latest.json txf_hourly_history.json
          if git diff --cached --quiet; then
            echo "No completed checkpoint to publish."
          else
            git commit -m "Update TXF hourly levels"
            git pull --rebase --autostash origin main
            git push
          fi
